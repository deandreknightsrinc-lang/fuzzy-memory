# Brand profile for BAC Ministries.
# Every generator (service kit, newspaper, future news show) reads this file.
# To white-label for another ministry, copy brands/_template/ and fill it in.

ministry:
  name: BAC Ministries
  short_name: BAC
  tagline: "In the beginning was the Word"
  website: ""            # e.g. https://bacministries.org
  youtube: ""            # channel URL
  giving_url: ""         # online giving link shown on screen during offering
  service_day: Sunday
  service_time: "11:00 AM"

colors:
  primary: "#1b1b1b"     # masthead / headlines
  accent: "#8a6d1d"      # gold rules, lower-third bar
  paper: "#fbf8f1"       # newspaper background
  ink: "#222222"

fonts:
  masthead: "Playfair Display"
  headline: "Libre Baskerville"
  body: "Libre Baskerville"
  sans: "Open Sans"

# ElevenLabs render settings used by `python -m studio voice`.
# Higher stability = steadier, more "pulpit" delivery; lower = more expressive.
elevenlabs:
  model_id: eleven_multilingual_v2
  stability: 0.5
  similarity_boost: 0.8
  style: 0.0

# Pulpit staff. Only fill in voice_id / avatar_id for people who have signed
# the likeness consent form (docs/04-consent-and-disclosure.md).
#   voice_id:  ElevenLabs > Voices > (their cloned voice) > "ID" button
#   avatar_id: HeyGen > Avatars > (their avatar) > ... > copy avatar ID
#              (only needed for the heygen.md hand-off sheet)
staff:
  - key: apostle
    name: Apostle Sir DeAndre Knight
    title: Senior Pastor / Apostle
    roles: [sermon, welcome, benediction, editor]
    consent_on_file: true
    voice_id: ""
    avatar_id: ""
  - key: harris
    name: Dr. Minister Daniel Alejandro Harris Bey
    title: Minister of Prayer, Kundalino Ministries
    roles: [prayer, prayer_column]
    consent_on_file: false
    voice_id: ""
    avatar_id: ""
  # Add associate ministers, worship leader, announcements host, deacons...
  # - key: worship
  #   name: ""
  #   title: Worship Leader
  #   roles: [worship]
  #   consent_on_file: false

# The weekly news show built from each newspaper issue (`python -m studio show <issue>`).
news_show:
  name: "BAC Ministries News"
  anchor: apostle            # opens the show, introduces each desk, signs off
  co_anchor: ""              # staff key of a second host, once you have one
  host_source:               # how each presenter appears: ai_avatar | ai_voice | recorded
    apostle: ai_avatar       # HeyGen avatar lip-synced to his ElevenLabs voice
    harris: recorded         # on camera until his likeness consent is signed
  desks:                     # who presents each newspaper section (default: the article's author)
    prayer_weekly: harris
  words_per_minute: 150
  max_story_minutes: {front: 4, the_word: 3, business: 3, community: 2}
  sign_off: "That's the news for this week from BAC Ministries. Stay in the Word, speak life, and we'll see you next week."

newspaper:
  title: BAC MINISTRIES
  editor: apostle
  next_issue_number: 11
  sections: [front, the_word, prayer_weekly, business, community, classifieds]
