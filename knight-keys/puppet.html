<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Puppet screen</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #00b140; font-family: system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; }
    #face { height: 92vh; aspect-ratio: 120 / 130; }
    #face svg { width: 100%; height: 100%; }
    #lower { position: fixed; left: 4vw; bottom: 5vh; padding: 1.2vh 2vw; border-radius: 1vh; background: rgba(0, 0, 0, .7); color: #fff; font-size: 3.4vh; font-weight: 700; display: none; }
    #lower small { display: block; font-size: 2.2vh; font-weight: 400; opacity: .8; }
    #hint { position: fixed; left: 10px; top: 8px; color: #fff; font-size: 13px; opacity: .75; text-shadow: 0 1px 2px #000; }
  </style>
</head>
<body>
  <div id="stage"><div id="face"></div></div>
  <div id="lower"></div>
  <div id="hint">Waiting for the Puppet Studio… (double-click for full screen)</div>
  <script type="module" src="js/puppet-screen.js"></script>
</body>
</html>
