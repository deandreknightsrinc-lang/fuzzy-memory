name: Build Knight Lyfe Ultimate

# Builds the Logic Pro plug-in (AU), VST3 and standalone app for Mac, validates
# the AU with Apple's auval, and uploads them as a download (see the README in
# knight-lyfe-ultimate/). A Linux build runs the engine tests too.

on:
  push:
    paths:
      - 'knight-lyfe-ultimate/**'
      - 'knight-keys/**'
      - 'sound-library/**'
      - '.github/workflows/plugin.yml'
  pull_request:
    paths:
      - 'knight-lyfe-ultimate/**'
      - 'knight-keys/**'
      - 'sound-library/**'
      - '.github/workflows/plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.15-${{ runner.os }}

      - name: Configure
        run: cmake -S knight-lyfe-ultimate -B build -G Xcode -DCMAKE_BUILD_TYPE=Release

      - name: Build AU, VST3, standalone app and engine tests
        run: cmake --build build --config Release --parallel 4

      - name: Engine tests
        run: build/KnightLyfeEngineTests_artefacts/Release/KnightLyfeEngineTests

      - name: Sound library scripts (bash 3.2-safe, sorting rules)
        run: |
          T="$RUNNER_TEMP/lib"; export HOME="$T/home"; mkdir -p "$HOME" "$T/drive" "$T/pack"
          bash sound-library/setup-library.sh "$T/drive"
          touch "$T/pack/Big Kick.wav" "$T/pack/808 Bass C.wav" "$T/pack/Choir Ooh.wav" "$T/pack/Custom Thing.wav" "$T/pack/Hat Open.aif"
          bash sound-library/organize-samples.sh "$T/pack"
          L="$T/drive/Knight Lyfe Sound Library"
          test -f "$L/Drums/Kicks/Big Kick.wav"
          test -f "$L/Bass/808 Bass/808 Bass C.wav"
          test -f "$L/Choir & Vocals/Choir/Choir Ooh.wav"
          test -f "$L/Drums/Hi-Hats/Hat Open.aif"
          test -f "$L/Inbox (drop new sounds here)/Unsorted/Custom Thing.wav"
          test -L "$HOME/Music/Audio Music Apps/Patches/Instrument/Knight Lyfe"
          # Sound packs: made, tested, and installed by the setup when they sit next to it
          node --test sound-library/packs/packs.test.mjs
          mkdir -p "$T/tools" && cp sound-library/*.sh "$T/tools/"
          node sound-library/packs/make-packs.mjs "$T/tools/Sound Packs"
          bash "$T/tools/setup-library.sh" "$T/drive"
          bash "$T/tools/setup-library.sh" "$T/drive" # again: nothing is copied twice
          test -f "$L/Drums/Kicks/Knight Lyfe Drums Vol 1/KL Kick 01 Punch.wav"
          test -f "$L/Drums/808s/Knight Lyfe Drums Vol 1/KL 808 Dirty C.wav"
          test -f "$L/MIDI/Drum Grooves/Knight Lyfe Gospel MIDI/KL Drum Groove - Gospel Shuffle (88 bpm).mid"
          test -f "$L/MIDI/Chord Progressions/Knight Lyfe Gospel MIDI/KL Chords - Gospel 2-5-1 in C (76 bpm).mid"
          test -f "$L/Licenses/Knight Lyfe Drums Vol 1.txt"
          test "$(find "$L" -name '* (2).*' | wc -l)" -eq 0
          test "$(find "$L/Inbox (drop new sounds here)/Unsorted" -type f | wc -l)" -eq 1 # only the test's "Custom Thing.wav"

      - name: Check it is universal and runs on macOS 11+
        run: |
          BIN="build/KnightLyfeUltimate_artefacts/Release/AU/Knight Lyfe Ultimate.component/Contents/MacOS/Knight Lyfe Ultimate"
          archs=$(lipo -archs "$BIN"); echo "Architectures: $archs"
          minos=$(otool -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}'); echo "Minimum macOS: $minos"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "::error::not a universal binary"; exit 1; }
          [[ "$minos" == "11.0" ]] || { echo "::error::minimum macOS is $minos, expected 11.0"; exit 1; }

      - name: Sign (ad hoc) so Apple Silicon Macs can load it
        run: |
          cd "build/KnightLyfeUltimate_artefacts/Release"
          codesign --force --deep --sign - "AU/Knight Lyfe Ultimate.component"
          codesign --force --deep --sign - "VST3/Knight Lyfe Ultimate.vst3"
          codesign --force --deep --sign - "Standalone/Knight Lyfe Ultimate.app"

      - name: Validate the Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/KnightLyfeUltimate_artefacts/Release/AU/Knight Lyfe Ultimate.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a | grep -i "Klyf" || true
          auval -strict -v aumu Kkey Klyf

      - name: Package
        run: |
          mkdir -p dist
          cd "build/KnightLyfeUltimate_artefacts/Release"
          ditto -c -k --keepParent "AU/Knight Lyfe Ultimate.component" "$GITHUB_WORKSPACE/dist/Knight Lyfe Ultimate (AU for Logic).zip"
          ditto -c -k --keepParent "VST3/Knight Lyfe Ultimate.vst3" "$GITHUB_WORKSPACE/dist/Knight Lyfe Ultimate (VST3).zip"
          ditto -c -k --keepParent "Standalone/Knight Lyfe Ultimate.app" "$GITHUB_WORKSPACE/dist/Knight Lyfe Ultimate (App).zip"
          cp "$GITHUB_WORKSPACE/knight-lyfe-ultimate/INSTALL-MAC.txt" "$GITHUB_WORKSPACE/dist/"
          cp "$GITHUB_WORKSPACE/knight-lyfe-ultimate/install.sh" "$GITHUB_WORKSPACE/dist/"
          mkdir -p "$GITHUB_WORKSPACE/dist/Sound Library Tools"
          cp "$GITHUB_WORKSPACE"/sound-library/*.sh "$GITHUB_WORKSPACE"/sound-library/README.md "$GITHUB_WORKSPACE/dist/Sound Library Tools/"
          node "$GITHUB_WORKSPACE/sound-library/packs/make-packs.mjs" "$GITHUB_WORKSPACE/dist/Sound Library Tools/Sound Packs"

      - name: Test the installer the way a user runs it
        run: |
          rm -rf ~/Library/Audio/Plug-Ins/Components/"Knight Lyfe Ultimate.component"
          bash dist/install.sh
          test -d "/Library/Audio/Plug-Ins/Components/Knight Lyfe Ultimate.component"
          test -d "/Library/Audio/Plug-Ins/VST3/Knight Lyfe Ultimate.vst3"
          test -d "/Applications/Knight Lyfe Ultimate.app"
          codesign --verify --deep "/Library/Audio/Plug-Ins/Components/Knight Lyfe Ultimate.component"
          auval -v aumu Kkey Klyf | grep "AU VALIDATION SUCCEEDED"

      - uses: actions/upload-artifact@v4
        with:
          name: Knight-Lyfe-Ultimate-macOS
          path: dist/
          retention-days: 30

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libwebkit2gtk-4.1-dev libgtk-3-dev libcurl4-openssl-dev

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.15-${{ runner.os }}

      - name: Configure
        run: cmake -S knight-lyfe-ultimate -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3, standalone app and engine tests
        run: cmake --build build --parallel 4

      - name: Engine tests
        run: build/KnightLyfeEngineTests_artefacts/Release/KnightLyfeEngineTests
