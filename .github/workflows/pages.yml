name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Knight Keys tests
        run: npm test
        working-directory: knight-keys
      - name: Run KBK Studio tests
        run: npm test
        working-directory: kbk-studio
      - name: Run KBK helper tests
        run: python3 -m unittest discover -s kbk-studio/server
      - name: Run Bible studio tests
        run: python3 -m unittest discover ai-studio/bible
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html _site/
          cp -r dashboard _site/
          cp -r church _site/
          cp -r studio-desk _site/
          mkdir _site/kbk-studio
          cp -r kbk-studio/index.html kbk-studio/styles.css kbk-studio/js kbk-studio/vendor _site/kbk-studio/
          mkdir _site/knight-keys
          cp -r knight-keys/index.html knight-keys/stage.html knight-keys/puppet.html knight-keys/styles.css knight-keys/js knight-keys/samples knight-keys/vendor _site/knight-keys/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
